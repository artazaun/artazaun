<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>artazaun // digital magazine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Desktop Area -->
   <div id="desktop">
    <!-- Top-Right Copyright & Curation Disclaimer -->
    <div class="desktop-disclaimer">
        All product imagery belongs to respective brands. Curated for editorial discovery. Non-commercial.
    </div>
        <!-- Desktop Folders -->
        <div class="desktop-icon" onclick="openWindow('wardrobe')">
            <div class="folder-icon"></div>
            <span>Wardrobe</span>
        </div>

        <div class="desktop-icon" onclick="openWindow('japanese')">
            <div class="folder-icon"></div>
            <span>Learn Japanese</span>
        </div>

        <div class="desktop-icon" onclick="openWindow('photography')">
            <div class="folder-icon"></div>
            <span>Photography</span>
        </div>

        <!-- Fullscreen Editorial Lookbook Window -->
        <div id="win-window" class="window" style="display: none;">
            <div class="window-header" onmousedown="startDrag(event)">
                <span id="win-title">artazaun // wardrobe archive</span>
                <div class="window-controls">
                    <button class="win-btn minimize" onclick="minimizeWindow()">&#8211;</button>
                    <button class="win-btn maximize" onclick="maximizeWindow()">&#9633;</button>
                    <button class="win-btn close" onclick="closeWindow()">&#10005;</button>
                </div>
            </div>
            
            <!-- Window Toolbar / Global Controls -->
            <div class="window-toolbar">
                <span class="toolbar-path">C:\artazaun\wardrobe\</span>
                <button class="global-lang-btn" onclick="toggleGlobalLanguage()">🌐 JP / ENG</button>
            </div>

            <div class="window-body" id="win-content">
                <!-- Content injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Windows 7 Taskbar -->
    <div id="taskbar">
        <button class="start-button">
            <div class="start-orb"></div>
        </button>
        
        <div class="taskbar-center" id="taskbar-apps"></div>

        <div class="taskbar-tray">
            <div class="tray-icons">
                <span class="tray-icon">&#128266;</span>
                <span class="tray-icon">&#128421;</span>
            </div>
            <div class="tray-clock" id="taskbar-clock">
                <div id="clock-time">00:00</div>
                <div id="clock-date">00/00/0000</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
