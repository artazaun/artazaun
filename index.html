<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>artazaun</title>
    
    <!-- Google Fonts: Inter (English) + RocknRoll One (Japanese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&family=RocknRoll+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Initial Gatekeeper Screen */
        #gate {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        /* YouTube-Style Red Button */
        .enter-btn {
            background-color: #FF0000; /* Classic YouTube Red */
            border: 2px solid #111111; /* Crisp black outline */
            padding: 1.2rem 3.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700; /* Extra bold white text */
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 2px 2px 0px #111111; /* Brutalist black shadow */
        }

        .enter-btn:hover {
            background-color: #111111; /* Inverts to solid black on hover */
            color: #ffffff;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #FF0000; /* Shadow turns red on hover */
        }

        /* Main Content Screen */
        #main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3.5rem;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .content-group {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #111111;
            text-transform: lowercase;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #777777;
            text-transform: uppercase;
        }

        /* Japanese Reflection Styling */
        .reflection {
            font-family: 'RocknRoll One', sans-serif;
        }

        .reflection h1 {
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #111111;
        }

        .reflection p {
            color: #777777;
        }
    </style>
</head>
<body>

    <!-- 1. The Entry Gate -->
    <div id="gate">
        <button class="enter-btn" onclick="enterSite()">ようこそ！</button>
    </div>

    <!-- 2. The Main Archive Content -->
    <div id="main-content">
        <div class="content-group">
            <h1>artazaun</h1>
            <p>coming soon</p>
        </div>

        <div class="content-group reflection">
            <h1>アルタザーン</h1>
            <p>まもなく公開</p>
        </div>
    </div>

    <!-- JavaScript to handle the click transition -->
    <script>
        function enterSite() {
            const gate = document.getElementById('gate');
            const mainContent = document.getElementById('main-content');
            
            gate.style.opacity = '0';
            setTimeout(() => {
                gate.style.display = 'none';
            }, 500);

            mainContent.style.opacity = '1';
        }
    </script>

</body>
</html>
